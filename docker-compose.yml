# to run first time:
# docker compose up --build
#
# later:
# docker compose up
# if it says permission denied, run:
# sudo chown -R $USER:$USER backend/generated/
#
# the app is served only through Caddy at https://localhost
# (frontend at /, backend at /api, sockets at /socket.io)

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # keeps the local CA/certificates between restarts
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
  backend:
    build: ./backend
    expose:
      - "3001" # reachable by caddy only, not from the host
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "rm -rf /app/generated && npx prisma generate && npx ts-node-dev src/server.ts"
  frontend:
    build: ./frontend
    expose:
      - "3000" # reachable by caddy only, not from the host
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=https://localhost/api
      - NEXT_PUBLIC_SOCKET_URL=https://localhost
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  caddy_data:
  caddy_config:
