# to run first time:
# docker compose up --build
#
# later:
# docker compose up
# if it says permission denied, run:
# sudo chown -R $USER:$USER backend/generated/
#
# the app is served only through Caddy at https://localhost:8443
# (frontend at /, backend at /api, sockets at /socket.io)
# 8443 instead of 443 because rootless Docker can't publish ports below 1024

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # keeps the local CA/certificates between restarts
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "3001" # reachable by caddy only, not from the host
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules
    env_file:
      - .env
    command: sh -c "rm -rf /app/generated && npx prisma generate && npx ts-node-dev src/server.ts"
  frontend:
    build: ./frontend
    expose:
      - "3000"
    volumes:
      - ./shared:/shared
    environment:
      - NEXT_PUBLIC_API_URL=${BACKEND_URL}
      - NEXT_PUBLIC_SOCKET_URL=${FRONTEND_URL}
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
  caddy_data:
  caddy_config:
