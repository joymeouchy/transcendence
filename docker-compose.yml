# works for now. in our code we need to later fix things when we want to run outside of localhost
# to run first time:
# docker compose up --build
#
# then run:
# docker compose exec backend npx prisma migrate deploy
#
# later:
# docker compose up

# if it says permision denied, run:
# sudo chown -R $USER:$USER backend/generated/

services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: "postgresql://postgres:1234@postgres:5432/transcendence_db"
      JWT_SECRET: "some_secret_key"
      GOOGLE_CLIENT_ID: "236757838064-s1s9mekv8kl6msdocgbdcgoi1t2hbbqk.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: "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"
      SESSION_SECRET: "some_random_string"

    command: sh -c "rm -rf /app/generated && npx prisma generate && npx prisma migrate deploy && npx ts-node-dev src/server.ts"

  postgres:
    image: postgres:15

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: transcendence_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules: