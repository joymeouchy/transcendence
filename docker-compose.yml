# to run (also after every code change):
# docker compose up --build
#
# the app is served only through Caddy at https://localhost:8443
# (frontend at /, backend at /api, sockets at /socket.io)
# 8443 instead of 443 because rootless Docker can't publish ports below 1024

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # keeps the local CA/certificates between restarts
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
  # production builds: code is compiled into the images, so after changing
  # code run docker compose up --build again
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runner
    expose:
      - "3001" # reachable by caddy only, not from the host
    env_file:
      - .env
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        # baked into the browser code at build time
        NEXT_PUBLIC_API_URL: ${BACKEND_URL}
        NEXT_PUBLIC_SOCKET_URL: ${FRONTEND_URL}
    expose:
      - "3000"
    environment:
      # read by next.config.ts at runtime for the allowed image hosts
      NEXT_PUBLIC_SOCKET_URL: ${FRONTEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
volumes:
  caddy_data:
  caddy_config:
